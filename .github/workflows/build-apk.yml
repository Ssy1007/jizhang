name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias jizhang \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=jizhang,O=jizhang,C=CN"

      - name: Init and Build TWA
        run: |
          bubblewrap init --manifest "https://ssy1007.github.io/jizhang/manifest.json" --directory twa-project 2>&1 || true
          cd twa-project
          bubblewrap build 2>&1
        timeout-minutes: 15

      - name: Find APK
        run: |
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          ls -la twa-project/ 2>/dev/null || echo "No twa-project dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: "**/*.apk"
          if-no-files-found: ignore
