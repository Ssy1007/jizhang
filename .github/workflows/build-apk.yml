name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -qo tools.zip
          rm tools.zip
          if [ -d cmdline-tools ]; then mv cmdline-tools latest; else mkdir -p latest && mv bin lib NOTICE.txt source.properties latest/ 2>/dev/null || true; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore twa-project/android.keystore \
            -alias jizhang \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=jizhang,O=jizhang,C=CN"

      - name: Build APK
        working-directory: twa-project
        run: |
          set -eo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          ls -la $ANDROID_HOME/platforms/
          ls -la $ANDROID_HOME/build-tools/
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
          ls -la gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== Last 50 lines of build ==="
          tail -50 build.log
        timeout-minutes: 20

      - name: Find and Upload APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Listing build output dirs ==="
          find twa-project -type d -name "build" 2>/dev/null | head -10 || echo "No build dirs"
          ls -la twa-project/app/build/outputs/apk/ 2>/dev/null || echo "No standard apk dir"
          ls -la twa-project/app/build/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: "**/*.apk"
          if-no-files-found: warn
