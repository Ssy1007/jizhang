name: Build APK

on:
  workflow_dispatch:

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Bubblewrap project
        uses: GoogleChromeLabs/bubblewrap-action/init@v2
        with:
          url: https://ssy1007.github.io/jizhang/
          package: com.jizhang.app
          app-name: 记账
          short-name: 记账
          output-directory: twa-project

      - name: Build APK
        run: |
          cd twa-project
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: twa-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
