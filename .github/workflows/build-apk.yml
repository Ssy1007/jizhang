name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: circleci/android:api-30
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias jizhang \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=jizhang,O=jizhang,C=CN"

      - name: Init TWA project
        run: |
          bubblewrap init \
            --manifest "https://ssy1007.github.io/jizhang/manifest.json" \
            --directory twa-project
        timeout-minutes: 5

      - name: Build APK
        run: |
          cd twa-project
          bubblewrap build
        timeout-minutes: 10

      - name: Collect APK
        run: |
          find . -name "*.apk" 2>/dev/null || echo "no apk"
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-apk
          path: artifacts/
          if-no-files-found: ignore
