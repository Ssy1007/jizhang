plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jizhang.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jizhang.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [
            hostName: "ssy1007.github.io",
            defaultUrl: "https://ssy1007.github.io/jizhang/",
            launcherName: "记账"
        ]
    }

    signingConfigs {
        release {
            storeFile rootProject.file('android.keystore')
            storePassword 'android'
            keyAlias 'jizhang'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
